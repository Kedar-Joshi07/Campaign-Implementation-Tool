[pytest]
addopts = -ra
markers =
    unit: Fast unit-level tests with no clean-room runtime requirements.
    integration: API/service integration tests over local fixtures/runtime DB.
    cleanroom: Deterministic clean-room phase1-7 reproducibility validation.
    full5m: Heavy validations that require canonical 5M-scale inputs.
    browser: Frontend/browser-facing contract or smoke coverage.
    performance: Runtime/performance-oriented checks.
